  <rect x="141" y="75" width="1318" height="370" rx="37" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.86"/>

  <rect x="196" y="126" width="62" height="62" rx="13" fill="#111111"/>
  <text x="227" y="158" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">oz.</text>
  <text x="286" y="144" dominant-baseline="middle" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">AI HEALTHCARE MINI PROJECT · TEAM 11</text>
  <text x="286" y="174" dominant-baseline="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">EDA · VISUALIZATION · GROUP COMPARISON</text>

  <text x="196" y="252" dominant-baseline="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800">SMOKING &amp; HEALTH DATA</text>
  <text x="196" y="307" dominant-baseline="middle" fill="#334155" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="27" font-weight="700">흡연 여부별 건강 지표 분석</text>
  <text x="196" y="349" dominant-baseline="middle" fill="#64748B" font-family="'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif" font-size="19">7,000건 · 18개 컬럼 · BMI · 충치 · 중성지방 · 혈압</text>

