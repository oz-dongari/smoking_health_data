  </defs>

  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>

  <g opacity="0.66" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 94 C76 65 117 66 132 94 C148 78 180 84 187 110 C194 136 172 154 143 151 H91 C62 151 44 131 48 111 C49 104 50 99 52 94 Z" fill="#D9F2FF" stroke="#BDE6F6" stroke-width="5"/>
