<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Smoking and Health Data Analysis</title>
  <desc id="desc">Team 11 smoking and health data analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="0.52" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#FBF7FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="140" y1="80" x2="1460" y2="450" gradientUnits="userSpaceOnUse">
